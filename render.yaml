# render.yaml
# Blueprint configuration for deploying PayNest Support Assistant on Render.
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: paynest-support-agent
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt && python scripts/seed_demo.py --local-only"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: HINDSIGHT_BASE_URL
        value: https://api.hindsight.vectorize.io
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///data/app.db
      - key: ALLOWED_ORIGINS
        value: "*"
